version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: qadaha_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qadaha_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_CONNECTION_STR=mongodb://admin:password123@mongodb:27017
    volumes:
      - ./resources:/app/resources
      - ./models:/app/models

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: qadaha_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000

volumes:
  mongodb_data: 